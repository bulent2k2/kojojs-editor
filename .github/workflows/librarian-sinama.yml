# Librarian'ın (libraries.json okuyucusu) sınaması -- editör #64.
#
# `server/test` (sbt 0.13 + Play 2.6, bkz. denetimler.yml) CI'da koşmuyor; LibrarianSpec bu yüzden
# 2017'den 2026'ya kırmızı kaldı ve kimse görmedi. librarian-sinama/ projesi Librarian'ı ve
# LibrarianSpec'i (editörün KENDİ dosyaları, kopya değil) güncel sbt'de derleyip koşturuyor.
#
# KAPSAM DIŞI: server'ın geri kalanı (Play denetleyicileri, ApiGuardSpec, UpdateFiddleSpec...).
# Onlar hâlâ yalnız `JAVA_HOME=…1.8 sbt server/test` ile yerelde koşuyor.
name: librarian sınaması

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  librarian-sinamasi:
    name: LibrarianSpec koşuyor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: librarian-sinama test
        working-directory: librarian-sinama
        run: sbt -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 test
