# Yardım sayfalarındaki elle yapıştırılan bağlantıların savları.
#
# Bu depoda derleme CI'ı yok (editör sbt 0.13 + Play 2.6 ve yerel ~/.ivy2
# önbelleği istiyor; bkz. koco-deploy/README). Buradaki denetimler saf Python,
# saniyeler sürüyor ve derlemeye hiç dokunmuyor.
name: denetimler

on:
  push:
    branches: [master]
  pull_request:

jobs:
  denetimler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ?zrc= bağlantıları ELLE yapıştırılıyor ve uzunluklarını kimse saymıyor.
      # Sınırı aşan bir bağlantı derlemeyi, sınamayı ve dağıtımı sessizce geçip
      # ancak kullanıcı tıklayınca HTTP 414 veriyor. Eylül 2026'da tam bu oldu
      # (kojoOgren "XOX -- yenilmez", 3698 karakter); 618 bağlantı içinde tek
      # bozuk olan oydu.
      - name: yardım bağlantıları URI sınırına sığıyor mu
        run: python3 baglanti-denetle.py

      # Sunulan sözlük, kaynağı olan kojojs-dev'deki dosyadan ELLE kopyalanıyor.
      # Bir turda unutuldu ve sunulan sözlük 754 girdide kaldı, kaynak 975'e
      # çıkmışken; sync-sozluk.sh tam bunun üzerine yazıldı ama kapıya hiç
      # takılmamıştı. Artık takılıyor.
      #
      # YALNIZ master'da: bu iki depo çiftler hâlinde değişiyor (bir kusur hem
      # kaynakta hem aynada düzeltiliyor), ve PR'larda kojojs-dev'in master'ına
      # bakmak öyle her çiftte kırmızı yanardı -- sürekli kırmızı yanan bir
      # gözcüyü kimse okumaz. master'da kırmızı ise sav gerçekten bozuk:
      # sunulan kopya ile kaynak o an ayrı düşmüş demektir.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          repository: bulent2k2/kojojs-dev
          path: kojojs-dev
      - name: sunulan sözlük kopyası kaynakla aynı mı
        if: github.event_name == 'push'
        run: |
          ./sync-sozluk.sh --denetle kojojs-dev || {
            echo "::error::İki depo ayrı düştü. Kaynak kojojs-dev -- ama buradaki kopya DAHA"
            echo "::error::YENİ ise eksik olan kojojs-dev tarafındaki PR'dır; sync-sozluk.sh'i"
            echo "::error::körlemesine koşmak düzeltmeyi geri alır. Önce hangi tarafın yeni"
            echo "::error::olduğuna bakın."
            exit 1
          }
