callbackBaseURL = "http://localhost.scalafiddle.io:9000/authenticate"
callbackBaseURL = ${?SCALAFIDDLE_AUTH_URL}

silhouette {

  # Authenticator settings
  #
  # secureCookie burada false (yerelde http://localhost'ta giriş çalışsın diye).
  # Üretimde koco-deploy start.sh, PUBLIC_URL https ise authenticator ve
  # csrfStateItemHandler için -D...secureCookie=true veriyor. OAuth1 çerezi
  # kullanılmıyor (giriş yalnız GitHub, OAuth2). SameSite=Lax: SameSiteFilter (#47).
  authenticator.cookieName="authenticator"
  authenticator.cookiePath="/"
  authenticator.secureCookie=false // Disabled for testing on localhost without SSL, otherwise cookie couldn't be set
  authenticator.httpOnlyCookie=true
  authenticator.useFingerprinting=true
  authenticator.authenticatorIdleTimeout=30 days
  authenticator.authenticatorExpiry=90 days

  authenticator.rememberMe.cookieMaxAge=30 days
  authenticator.rememberMe.authenticatorIdleTimeout=5 days
  authenticator.rememberMe.authenticatorExpiry=30 days

  # İmzalama/şifreleme anahtarları ortamdan (koco-deploy#18): SILHOUETTE_KEY
  # varsa aşağıdaki "[changeme]" sabitlerinin yerine geçer. Eskiden koco-deploy
  # bunları -D bayraklarıyla veriyordu ve anahtarlar `ps` çıktısında açık
  # duruyordu; ortam değişkeni süreç komut satırında görünmüyor.
  # Ortam değişkeni yoksa sabit kalır (yukarı akışın davranışı). koco-deploy
  # start.sh her zaman bir değer veriyor (secret yoksa geçici üretilmiş).
  #
  # Anahtara özgü değişkenler (SILHOUETTE_AUTHENTICATOR_SIGNER_KEY vb.) varsa
  # SILHOUETTE_KEY'in de yerine geçer. Bugün altısı aynı değeri alıyor ve iki
  # ayrı kriptografik rolde kullanılıyor (JcaSigner/HMAC, JcaCrypter/AES);
  # anahtarları ayırmak için editörün yeni bir sürümü gerekmesin diye.
  #
  # DİKKAT: ${?X} yalnız X TANIMSIZSA atlanır. Tanımlı ama boşsa değer boş
  # dizge olur, "[changeme]"e dönmez. Boş değer vermemek dağıtımın işi.
  authenticator.signer.key = "[changeme]" // A unique encryption key
  authenticator.signer.key = ${?SILHOUETTE_KEY}
  authenticator.signer.key = ${?SILHOUETTE_AUTHENTICATOR_SIGNER_KEY}
  authenticator.crypter.key = "[changeme]" // A unique encryption key
  authenticator.crypter.key = ${?SILHOUETTE_KEY}
  authenticator.crypter.key = ${?SILHOUETTE_AUTHENTICATOR_CRYPTER_KEY}

  # OAuth1 token secret provider settings
  oauth1TokenSecretProvider.cookieName="OAuth1TokenSecret"
  oauth1TokenSecretProvider.cookiePath="/"
  oauth1TokenSecretProvider.secureCookie=false // Disabled for testing on localhost without SSL, otherwise cookie couldn't be set
  oauth1TokenSecretProvider.httpOnlyCookie=true
  oauth1TokenSecretProvider.expirationTime=120 minutes

  oauth1TokenSecretProvider.cookie.signer.key = "[changeme]" // A unique encryption key
  oauth1TokenSecretProvider.cookie.signer.key = ${?SILHOUETTE_KEY}
  oauth1TokenSecretProvider.cookie.signer.key = ${?SILHOUETTE_OAUTH1_SIGNER_KEY}
  oauth1TokenSecretProvider.crypter.key = "[changeme]" // A unique encryption key
  oauth1TokenSecretProvider.crypter.key = ${?SILHOUETTE_KEY}
  oauth1TokenSecretProvider.crypter.key = ${?SILHOUETTE_OAUTH1_CRYPTER_KEY}

  # Social state handler
  socialStateHandler.signer.key = "[changeme]" // A unique encryption key
  socialStateHandler.signer.key = ${?SILHOUETTE_KEY}
  socialStateHandler.signer.key = ${?SILHOUETTE_SOCIAL_STATE_SIGNER_KEY}

  # CSRF state item handler settings
  csrfStateItemHandler.cookieName="OAuth2State"
  csrfStateItemHandler.cookiePath="/"
  csrfStateItemHandler.secureCookie=false // Disabled for testing on localhost without SSL, otherwise cookie couldn't be set
  csrfStateItemHandler.httpOnlyCookie=true
  csrfStateItemHandler.expirationTime=5 minutes

  csrfStateItemHandler.signer.key = "[changeme]" // A unique encryption key
  csrfStateItemHandler.signer.key = ${?SILHOUETTE_KEY}
  csrfStateItemHandler.signer.key = ${?SILHOUETTE_CSRF_STATE_SIGNER_KEY}

  # Facebook provider
  facebook.authorizationURL="https://graph.facebook.com/v2.3/oauth/authorize"
  facebook.accessTokenURL="https://graph.facebook.com/v2.3/oauth/access_token"
  facebook.redirectURL=${callbackBaseURL}/facebook
  facebook.clientID=""
  facebook.clientID=${?FACEBOOK_CLIENT_ID}
  facebook.clientSecret=""
  facebook.clientSecret=${?FACEBOOK_CLIENT_SECRET}
  facebook.scope="email"

  # Google provider
  google.authorizationURL="https://accounts.google.com/o/oauth2/auth"
  google.accessTokenURL="https://accounts.google.com/o/oauth2/token"
  google.redirectURL=${callbackBaseURL}/google
  google.clientID=""
  google.clientID=${?GOOGLE_CLIENT_ID}
  google.clientSecret=""
  google.clientSecret=${?GOOGLE_CLIENT_SECRET}
  google.scope="profile email"

  github {
    authorizationURL="https://github.com/login/oauth/authorize"
    accessTokenURL="https://github.com/login/oauth/access_token"
    redirectURL=${callbackBaseURL}/github
    clientID=""
    clientID=${?GITHUB_CLIENT_ID}
    clientSecret=""
    clientSecret=${?GITHUB_CLIENT_SECRET}
  }

  gitlab {
    authorizationURL="https://gitlab.com/oauth/authorize"
    accessTokenURL="https://gitlab.com/oauth/token"
    redirectURL=${callbackBaseURL}/gitlab
    clientID=""
    clientID=${?GITLAB_CLIENT_ID}
    clientSecret=""
    clientSecret=${?GITLAB_CLIENT_SECRET}
    scope="api"
  }

  # VK provider
  vk.authorizationURL="http://oauth.vk.com/authorize"
  vk.accessTokenURL="https://oauth.vk.com/access_token"
  vk.redirectURL=${callbackBaseURL}/vk
  vk.clientID=""
  vk.clientID=${?VK_CLIENT_ID}
  vk.clientSecret=""
  vk.clientSecret=${?VK_CLIENT_SECRET}
  vk.scope="email"

  # Twitter provider
  twitter.requestTokenURL="https://twitter.com/oauth/request_token"
  twitter.accessTokenURL="https://twitter.com/oauth/access_token"
  twitter.authorizationURL="https://twitter.com/oauth/authenticate"
  twitter.callbackURL=${callbackBaseURL}/twitter
  twitter.consumerKey=""
  twitter.consumerKey=${?TWITTER_CONSUMER_KEY}
  twitter.consumerSecret=""
  twitter.consumerSecret=${?TWITTER_CONSUMER_SECRET}

  # Xing provider
  xing.requestTokenURL="https://api.xing.com/v1/request_token"
  xing.accessTokenURL="https://api.xing.com/v1/access_token"
  xing.authorizationURL="https://api.xing.com/v1/authorize"
  xing.callbackURL=${callbackBaseURL}/xing
  xing.consumerKey=""
  xing.consumerKey=${?XING_CONSUMER_KEY}
  xing.consumerSecret=""
  xing.consumerSecret=${?XING_CONSUMER_SECRET}

  # Yahoo provider
  yahoo.providerURL="https://me.yahoo.com/"
  yahoo.callbackURL=${callbackBaseURL}/yahoo
  yahoo.axRequired={
    "fullname": "http://axschema.org/namePerson",
    "email": "http://axschema.org/contact/email",
    "image": "http://axschema.org/media/image/default"
  }
  yahoo.realm="http://localhost:9000"
}
